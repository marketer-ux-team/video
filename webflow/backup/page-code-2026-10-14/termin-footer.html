<script>
// Get URL Parameters into Variable
const GetURLParameter = (sParam) => {
  let sPageURL = window.location.search.substring(1);
  let sURLVariables = sPageURL.split("&");
  for (let i = 0; i < sURLVariables.length; i++) {
    let sParameterName = sURLVariables[i].split("=");
    if (sParameterName[0] == sParam) {
      return decodeURIComponent(sParameterName[1]);
    }
  }
};
let inviteeFullName = GetURLParameter("invitee_full_name");
let inviteeEmail = GetURLParameter("invitee_email");
let eventStartTime = new Date(GetURLParameter("event_start_time"));
let eventEndTime = new Date(GetURLParameter("event_end_time"));
eventStartTime
// Put Variable into Text-Span
document.getElementById("invitee-name").innerHTML = inviteeFullName;
document.getElementById("event-start-time").innerHTML = eventStartTime.toLocaleDateString('de-DE') + " " + eventStartTime.toISOString().replace(/^[^:]*([0-2]\d:[0-5]\d).*$/, "$1");
document.getElementById("event-end-time").innerHTML = eventEndTime.toLocaleDateString('de-DE') + " " + eventEndTime.toISOString().replace(/^[^:]*([0-2]\d:[0-5]\d).*$/, "$1");
</script>
