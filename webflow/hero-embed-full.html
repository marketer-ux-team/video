<div class="hero_video-wrapper" data-video-wrapper>
  <button class="hero-video" type="button" aria-label="Video abspielen"
    data-video-trigger
    data-video-src-1080="https://video-lyart-one.vercel.app/hero/hero-1080-v1.mp4"
    data-video-src-720="https://video-lyart-one.vercel.app/hero/hero-720-v1.mp4"
    data-video-poster="https://video-lyart-one.vercel.app/hero/hero-poster-v1.webp"
    data-video-vtt="https://video-lyart-one.vercel.app/hero/hero-de-v1.vtt">
    <img class="hero-video_thumbnail" src="https://video-lyart-one.vercel.app/hero/hero-poster-v1.webp" alt="Testen auf der Hauptseite" loading="eager" width="960" height="540">
    <span class="hero-video_play" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 5L19 12L8 19V5Z" fill="currentColor"/></svg></span>
  </button>
</div>

<style>
.hero_video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 940 / 529;
  overflow: hidden;
  background: #000;
}

.hero-video {
  position: absolute;
  z-index: 2;
  inset: 0;
  width: 100%;
  height: 100%;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
  opacity: 1;
  transition: opacity 0.35s ease;
}

.hero-video_thumbnail {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: opacity 0.35s ease;
}

.hero-video_play {
  position: absolute;
  top: 50%;
  left: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 64px;
  height: 64px;
  color: #000;
  background: #fff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition:
    transform 0.3s ease,
    opacity 0.3s ease;
}

.hero-video:hover .hero-video_play {
  transform: translate(-50%, -50%) scale(1.08);
}

.hero-video.is-loading {
  cursor: wait;
}

.hero-video.is-loading .hero-video_play svg {
  opacity: 0;
}

.hero-video.is-loading .hero-video_play::after {
  content: "";
  position: absolute;
  width: 22px;
  height: 22px;
  border: 2px solid rgba(0, 0, 0, 0.2);
  border-top-color: #000;
  border-radius: 50%;
  animation: hero-loader 0.7s linear infinite;
}

.hero_video-wrapper video {
  object-fit: cover;
  background: #000;
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  opacity: 0;
  cursor: pointer;
  transition: opacity 0.35s ease;
}

.hero_video-wrapper.is-loaded video {
  opacity: 1;
}

.hero_video-wrapper.is-loaded .hero-video {
  opacity: 0;
  pointer-events: none;
}

/* Pausiert: Play-Button über dem stehenden Bild, Vorschaubild bleibt unsichtbar. */
.hero_video-wrapper.is-loaded.is-paused .hero-video {
  opacity: 1;
  pointer-events: auto;
  background: rgba(0, 0, 0, 0.25);
}

.hero_video-wrapper.is-loaded.is-paused .hero-video_thumbnail {
  opacity: 0;
}

@keyframes hero-loader {
  to {
    transform: rotate(360deg);
  }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const HERO = {
    src1080: "https://video-lyart-one.vercel.app/hero/hero-1080-v1.mp4",
    src720: "https://video-lyart-one.vercel.app/hero/hero-720-v1.mp4",
    poster: "https://video-lyart-one.vercel.app/hero/hero-poster-v1.webp",
    vtt: "https://video-lyart-one.vercel.app/hero/hero-de-v1.vtt"
  };

  // Kein natives Bedienelement: der Player wird ausschließlich über den
  // mittigen Play-Button und einen Klick aufs Video gesteuert.
  const VIDEO_STYLE =
    "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000;border:0;cursor:pointer";

  document
    .querySelectorAll("[data-video-trigger], [dd-wistia-video-trigger]")
    .forEach((button) => {
      const legacy = !button.hasAttribute("data-video-trigger");

      const wrapper = button.closest(
        "[data-video-wrapper], [dd-wistia-video-wrapper]"
      );

      if (!wrapper) return;

      const sources = legacy
        ? HERO
        : {
            // NB: data-video-src-1080 maps to dataset["videoSrc-1080"], not
            // dataset.videoSrc1080 (the dash is followed by a digit), so read
            // these through getAttribute.
            src1080: button.getAttribute("data-video-src-1080"),
            src720: button.getAttribute("data-video-src-720"),
            poster: button.getAttribute("data-video-poster") || "",
            vtt: button.getAttribute("data-video-vtt") || ""
          };

      // Legacy embed (not yet swapped in the Designer): repoint the thumbnail
      // at the self-hosted poster so no third-party image is requested.
      if (legacy && sources.poster) {
        const thumbnail = button.querySelector("img.hero-video_thumbnail");

        if (thumbnail) {
          thumbnail.removeAttribute("srcset");
          thumbnail.src = sources.poster;
        }
      }

      let video = null;

      const createVideo = () => {
        const wide = window.matchMedia("(min-width: 768px)").matches;
        const src = wide ? sources.src1080 : sources.src720;

        if (!src) return null;

        const element = document.createElement("video");

        // CORS mode: required for the cross-origin <track> (server sends ACAO *).
        element.crossOrigin = "anonymous";
        element.src = src;
        element.poster = sources.poster || "";
        element.controls = false;
        element.preload = "auto";

        // Inline auf dem iPhone: playsInline allein reicht älteren iOS-Safari
        // nicht, die brauchen zusätzlich die beiden Attribute.
        element.playsInline = true;
        element.setAttribute("playsinline", "");
        element.setAttribute("webkit-playsinline", "");

        // Bild-in-Bild, AirPlay und Cast sperren — sonst blendet iOS die
        // nativen Schaltflächen trotz controls=false ein.
        element.disablePictureInPicture = true;
        element.setAttribute("disablepictureinpicture", "");
        element.disableRemotePlayback = true;
        element.setAttribute("disableremoteplayback", "");
        element.setAttribute("x-webkit-airplay", "deny");

        element.setAttribute(
          "controlslist",
          "nodownload nofullscreen noremoteplayback"
        );
        element.setAttribute("style", VIDEO_STYLE);
        element.setAttribute("aria-label", "Testen auf der Hauptseite");

        if (sources.vtt) {
          const track = document.createElement("track");

          track.kind = "subtitles";
          track.srclang = "de";
          track.label = "Deutsch";
          track.default = true;
          track.src = sources.vtt;

          element.appendChild(track);
        }

        element.addEventListener("playing", () => {
          wrapper.classList.add("is-loaded");
          wrapper.classList.remove("is-paused");
          button.classList.remove("is-loading");
          button.setAttribute("aria-label", "Video pausieren");
        });

        element.addEventListener("pause", () => {
          if (element.ended) return;

          wrapper.classList.add("is-paused");
          button.setAttribute("aria-label", "Video abspielen");
        });

        // Am Ende zurück in den Ausgangszustand: Vorschaubild und Play-Button.
        element.addEventListener("ended", () => {
          wrapper.classList.remove("is-loaded");
          wrapper.classList.remove("is-paused");
          element.currentTime = 0;
          button.setAttribute("aria-label", "Video abspielen");
        });

        element.addEventListener("error", () => {
          wrapper.classList.remove("is-loaded");
          wrapper.classList.remove("is-paused");
          button.classList.remove("is-loading");
        });

        // Klick auf das laufende Video pausiert, erneuter Klick spielt weiter.
        element.addEventListener("click", () => {
          if (element.paused) {
            element.play().catch(() => {});
          } else {
            element.pause();
          }
        });

        // Doppelklick würde sonst den Vollbildmodus auslösen.
        element.addEventListener("dblclick", (event) => {
          event.preventDefault();
        });

        wrapper.appendChild(element);

        return element;
      };

      button.addEventListener("click", () => {
        if (button.classList.contains("is-loading")) return;

        if (!video) {
          video = createVideo();

          if (!video) return;

          button.classList.add("is-loading");
          video.play().catch(() => button.classList.remove("is-loading"));

          return;
        }

        if (video.paused) {
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    });
});
</script>
